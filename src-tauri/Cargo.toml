[package]
name = "s-ui-hub"
version = "0.1.0"
description = "A quiet workspace for all your S-UI panels"
authors = ["RzMY"]
license = "MIT"
repository = "https://github.com/RzMY/S-UI-Hub"
edition = "2021"
rust-version = "1.94"

[lib]
name = "s_ui_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tempfile = "3"
zeroize = "1"
open = "5"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
rand = "0.10"
